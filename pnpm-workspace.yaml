packages:
  - packages/*
  - tools/*
  - apps/*
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vitest@5.1.0

# esbuild and workerd (wrangler) ship prebuilt platform binaries as optional deps;
# their postinstall scripts are not needed.
allowBuilds:
  esbuild: false
  workerd: false
